/* ---------- Interactive country map (OpenStreetMap + Leaflet) ---------- */
const nominatimNames={
  "Congo, Republic of the":"Republic of the Congo",
  "Democratic Republic of the Congo":"Democratic Republic of the Congo",
  "Ivory Coast":"Côte d'Ivoire",
  "Czech Republic":"Czechia",
  "Palestine":"State of Palestine",
  "Micronesia":"Federated States of Micronesia",
  "Gambia":"The Gambia",
  "Bahamas":"The Bahamas"
};
const mapBtn=document.getElementById("mapBtn"),
      mapSection=document.getElementById("mapSection"),
      mapStatus=document.getElementById("mapStatus");
let leafletMap=null, countryLayer=null, countryBounds=null;

function setMapStatus(msg){ mapStatus.textContent=msg; mapStatus.hidden=!msg; }

async function nominatim(params){
  const url="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&"+new URLSearchParams(params);
  const res=await fetch(url,{headers:{"Accept":"application/json"}});
  if(!res.ok) throw new Error("HTTP "+res.status);
  return res.json();
}

async function initMap(){
  if(typeof L==="undefined"){ setMapStatus("The map library could not be loaded. Check your internet connection and try again."); return; }

  const street=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
  const topo=L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{
    maxZoom:17, attribution:'Map data &copy; OpenStreetMap contributors, SRTM | Style &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'});

  // Fallback basemap for when OpenStreetMap's own servers refuse tiles (e.g. page opened from a file).
  // CARTO now requires a free key (https://carto.com/basemaps/apikey): paste it below to use CARTO.
  // Leave it empty to use Esri's keyless street map instead.
  const CARTO_KEY="cb1_4gc5_1_5aa283662d38ba77b61c24fa";
  const carto=CARTO_KEY
    ? L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key="+CARTO_KEY,{
        maxZoom:19, subdomains:"abcd",
        attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'})
    : L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{
        maxZoom:19,
        attribution:'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, OpenStreetMap contributors'});
  const fallbackLabel=CARTO_KEY?"🧭 Street (CARTO)":"🧭 Street (Esri)";
  const openFromDisk=location.protocol==="file:";
  const base=openFromDisk?carto:street;

  leafletMap=L.map("map",{layers:[base],scrollWheelZoom:false,worldCopyJump:true}).setView([20,0],2);
  L.control.layers({"🗺️ Street (OSM)":street,[fallbackLabel]:carto,"⛰️ Terrain":topo}).addTo(leafletMap);

  // If OSM's servers refuse our tiles (HTTP 403), switch automatically to the fallback basemap.
  let tileErrors=0;
  street.on("tileerror",()=>{
    if(++tileErrors===3 && leafletMap.hasLayer(street)){
      leafletMap.removeLayer(street); carto.addTo(leafletMap);
      console.warn("OSM tiles blocked (likely no Referer) – switched to fallback basemap.");
    }
  });
  L.control.scale({imperial:false}).addTo(leafletMap);

  // Avoid hijacking page scroll: enable wheel zoom only after the user clicks the map.
  leafletMap.on("click focus",()=>leafletMap.scrollWheelZoom.enable());
  leafletMap.on("mouseout blur",()=>leafletMap.scrollWheelZoom.disable());

  const q=nominatimNames[name]||name;
  try{
    const r=await nominatim({q, featuretype:"country", polygon_geojson:1, polygon_threshold:0.01, "accept-language":"en"});
    if(!r.length) throw new Error("not found");
    const hit=r[0];
    const bb=hit.boundingbox; // [south, north, west, east]
    countryBounds=L.latLngBounds([+bb[0],+bb[2]],[+bb[1],+bb[3]]);

    const geo=hit.geojson;
    const hasShape=geo && (geo.type==="Polygon"||geo.type==="MultiPolygon");
    if(hasShape){
      countryLayer=L.geoJSON(geo,{style:{color:"#c9a227",weight:2.5,fillColor:"#c9a227",fillOpacity:0.15}}).addTo(leafletMap);
      countryLayer.bindTooltip(name,{sticky:true});
    }else{
      // Tiny states/islands may only come back as a point – draw a highlighted circle instead.
      L.circle([+hit.lat,+hit.lon],{radius:4000,color:"#c9a227",fillOpacity:0.25}).addTo(leafletMap);
    }
    leafletMap.fitBounds(countryBounds,{padding:[20,20],maxZoom:10});
    setMapStatus("");
    addCapitalMarker(bb);
  }catch(err){
    console.warn("Country lookup failed:",err);
    setMapStatus("Couldn't load the border for "+name+" right now – you can still explore the world map. Try again in a moment.");
  }
}

// Second lookup (sequential, to respect Nominatim's 1 request/second policy).
async function addCapitalMarker(bb){
  const cap=String(c.capital||"").split(/[,(]/)[0].trim();
  if(!cap) return;
  await new Promise(r=>setTimeout(r,1100));
  try{
    const r=await nominatim({q:cap, viewbox:[bb[2],bb[1],bb[3],bb[0]].join(","), bounded:1, "accept-language":"en"});
    if(!r.length) return;
    L.marker([+r[0].lat,+r[0].lon]).addTo(leafletMap)
      .bindPopup(`<b>${cap}</b><br>Capital of ${name}`);
  }catch(e){ /* the capital marker is optional */ }
}

function openMap(){
  mapSection.hidden=false;
  mapBtn.textContent="🗺️ Hide map";
  if(!leafletMap) initMap(); else leafletMap.invalidateSize();
  mapSection.scrollIntoView({behavior:"smooth",block:"start"});
}
function closeMap(){
  document.body.classList.remove("map-full");
  mapSection.classList.remove("is-full");
  mapSection.hidden=true;
  mapBtn.textContent="🗺️ View "+name+" on Map";
}
mapBtn.onclick=()=>mapSection.hidden?openMap():closeMap();
document.getElementById("mapClose").onclick=closeMap;
document.getElementById("mapReset").onclick=()=>{
  if(leafletMap&&countryBounds) leafletMap.fitBounds(countryBounds,{padding:[20,20],maxZoom:10});
};
document.getElementById("mapFull").onclick=()=>{
  const on=mapSection.classList.toggle("is-full");
  document.body.classList.toggle("map-full",on);
  setTimeout(()=>leafletMap&&leafletMap.invalidateSize(),50);
};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&mapSection.classList.contains("is-full")) document.getElementById("mapFull").click();
});
// Deep link: country.html?country=France&map=1 opens the map straight away
if(new URLSearchParams(location.search).get("map")==="1") openMap();
</script>
