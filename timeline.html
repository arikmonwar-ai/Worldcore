<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Timeline | WORLDCORE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body.tts-enabled [data-speak] { cursor: help; }
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">🌍 WORLDCORE</a>
    <div class="d-flex align-items-center gap-3 ms-auto">
      <div class="form-check form-switch text-white m-0">
        <input class="form-check-input" type="checkbox" id="ttsToggle" checked>
        <label class="form-check-label small fw-bold" for="ttsToggle" id="ttsLabel">🔊 Audio Reader: ON</label>
      </div>
      <a class="btn btn-outline-light" href="index.html">Home</a>
    </div>
  </div>
</nav>

<main class="container py-5">
  <h1>🕰️ World Timeline</h1>
  <p class="text-secondary">Major events across world history. Filter by category below.</p>
  <div id="filters"></div>
  <div class="timeline" id="timeline"></div>
</main>

<script>
const events=[
  {era:"c. 3000 BCE", title:"Early Civilizations", cat:"Society", text:"Large urban societies developed in several regions, including the Nile and Mesopotamia."},
  {era:"c. 500 BCE", title:"Classical Era", cat:"Ideas", text:"Major philosophical, political and scientific traditions developed across different civilizations."},
  {era:"1206–1368", title:"Mongol Empire", cat:"Society", text:"One of the largest contiguous land empires in history connected trade routes across Asia and Europe."},
  {era:"15th–17th centuries", title:"Age of Global Exploration", cat:"Society", text:"Long-distance maritime connections expanded and reshaped interactions between regions."},
  {era:"1687", title:"Newton's Principia", cat:"Science", text:"Isaac Newton published foundational laws of motion and universal gravitation."},
  {era:"18th–19th centuries", title:"Industrial Revolution", cat:"Technology", text:"New machines, factories and transportation systems transformed economies and societies."},
  {era:"1859", title:"Theory of Evolution", cat:"Science", text:"Charles Darwin published On the Origin of Species, reshaping the biological sciences."},
  {era:"1945", title:"End of World War II", cat:"Society", text:"The war's end reshaped global political borders and led to the founding of the United Nations."},
  {era:"1969", title:"Moon Landing", cat:"Technology", text:"Apollo 11 carried the first humans to walk on the surface of the Moon."},
  {era:"1971", title:"Bangladesh Liberation War", cat:"Society", text:"Bangladesh achieved independence following the Liberation War."},
  {era:"1990s–present", title:"Digital Age", cat:"Technology", text:"The internet and personal computing rapidly transformed communication, commerce and daily life worldwide."}
];

const filters=document.getElementById("filters");
const timeline=document.getElementById("timeline");
const cats=["All",...new Set(events.map(e=>e.cat))];

filters.innerHTML = cats.map(c=>
  `<span class="chip${c==="All"?" active":""}" data-cat="${c}" role="button" tabindex="0" data-speak="Filter: ${c === "All" ? "show all events" : c}">${c}</span>`
).join("");

function render(cat){
  const list = cat==="All" ? events : events.filter(e=>e.cat===cat);
  timeline.innerHTML = list.map(e=>
    `<div tabindex="0" data-speak="${e.era}. ${e.title}. Category: ${e.cat}. ${e.text}"><span>${e.era} · ${e.cat}</span><h3>${e.title}</h3><p>${e.text}</p></div>`
  ).join("");
}

function selectChip(chip){
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  chip.classList.add("active");
  render(chip.dataset.cat);
}

document.querySelectorAll(".chip").forEach(chip=>{
  chip.onclick=()=>selectChip(chip);
  chip.onkeydown=e=>{
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); selectChip(chip); }
  };
});

render("All");

// --- Audio Reader (text-to-speech) ---
const ttsToggle=document.getElementById("ttsToggle");
const ttsLabel=document.getElementById("ttsLabel");
const synth="speechSynthesis" in window ? window.speechSynthesis : null;

if(!synth){
  ttsToggle.checked=false;
  ttsToggle.disabled=true;
  ttsLabel.textContent="🔇 Audio Reader: not supported";
}
const ttsOn=()=>!!synth && ttsToggle.checked;

function syncTts(){
  document.body.classList.toggle("tts-enabled",ttsOn());
  if(synth && !ttsToggle.disabled){
    ttsLabel.textContent=ttsOn()?"🔊 Audio Reader: ON":"🔇 Audio Reader: OFF";
  }
  if(synth && !ttsOn()) synth.cancel();
}
ttsToggle.addEventListener("change",syncTts);
syncTts();

function speak(text){
  if(!ttsOn()||!text) return;
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  synth.speak(u);
}

// Delegated listeners on <main> survive re-rendering when a filter is chosen
const main=document.querySelector("main");
main.addEventListener("mouseover",e=>{
  const el=e.target.closest("[data-speak]");
  if(el && !el.contains(e.relatedTarget)) speak(el.dataset.speak);
});
main.addEventListener("mouseout",e=>{
  const el=e.target.closest("[data-speak]");
  if(el && !el.contains(e.relatedTarget) && ttsOn()) synth.cancel();
});
main.addEventListener("focusin",e=>{
  const el=e.target.closest("[data-speak]");
  if(el) speak(el.dataset.speak);
});
window.addEventListener("beforeunload",()=>synth&&synth.cancel());
</script>
</body></html>
