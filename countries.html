const box = document.getElementById("countries");

function render(list) {
  if (!list.length) {
    box.innerHTML = `<p class="text-secondary">No countries found.</p>`;
    return;
  }
  box.innerHTML = list.map(c => `
    <div class="col-sm-6 col-lg-4">
      <div class="country-card" data-speak="${c[1]}. Located in ${c[2]}. Capital: ${c[3]}.">
        <div class="flag">${c[0]}</div>
        <h3>${c[1]}</h3>
        <p>🌐 ${c[2]}<br>🏛️ Capital: ${c[3]}</p>
        <a class="btn btn-dark" href="country.html?country=${encodeURIComponent(c[1])}">Explore</a>
      </div>
    </div>`).join("");
}
render(countries);

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  render(countries.filter(c => c[1].toLowerCase().includes(q)));
});

// --- Audio Reader (text-to-speech) ---
const ttsToggle = document.getElementById("ttsToggle");
const ttsLabel  = document.getElementById("ttsLabel");
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;

if (!synth) {
  ttsToggle.checked = false;
  ttsToggle.disabled = true;
  ttsLabel.textContent = "🔇 Audio Reader: not supported";
}

const ttsOn = () => !!synth && ttsToggle.checked;

function syncTts() {
  document.body.classList.toggle("tts-enabled", ttsOn());
  if (synth && !ttsToggle.disabled) {
    ttsLabel.textContent = ttsOn() ? "🔊 Audio Reader: ON" : "🔇 Audio Reader: OFF";
  }
  if (synth && !ttsOn()) synth.cancel();
}
ttsToggle.addEventListener("change", syncTts);
syncTts();

function speak(card) {
  if (!ttsOn()) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(card.dataset.speak);
  u.lang = "en-US";
  synth.speak(u);
}

// Delegated listeners survive re-rendering when the user searches
box.addEventListener("mouseover", e => {
  const card = e.target.closest(".country-card");
  if (card && !card.contains(e.relatedTarget)) speak(card);
});
box.addEventListener("mouseout", e => {
  const card = e.target.closest(".country-card");
  if (card && !card.contains(e.relatedTarget) && ttsOn()) synth.cancel();
});
// Keyboard users: tabbing to a card's Explore button reads the card
box.addEventListener("focusin", e => {
  const card = e.target.closest(".country-card");
  if (card) speak(card);
});
window.addEventListener("beforeunload", () => synth && synth.cancel());
