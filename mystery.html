  {name:"United Arab Emirates", clues:["I am a federation of seven emirates.","My capital is Abu Dhabi.","Dubai is one of my most famous cities."]},
  {name:"United Kingdom", clues:["I am an island country in northwestern Europe.","My capital is London.","I am made up of England, Scotland, Wales and Northern Ireland."]},
  {name:"United States", clues:["I am a country in North America.","My capital is Washington, D.C.","I have 50 states."]},
  {name:"Uruguay", clues:["I am a small country in southeastern South America.","My capital is Montevideo.","I lie between Argentina and Brazil."]},
  {name:"Uzbekistan", clues:["I am a landlocked country in Central Asia.","My capital is Tashkent.","I am one of only two doubly landlocked countries in the world."]},

  {name:"Vanuatu", clues:["I am an island country in the South Pacific.","My capital is Port Vila.","I am an archipelago made up of more than 80 islands."]},
  {name:"Vatican City", clues:["I am the world's smallest independent state by area and population.","I am located inside Rome.","I am the headquarters of the Catholic Church."]},
  {name:"Venezuela", clues:["I am a country on the northern coast of South America.","My capital is Caracas.","Angel Falls, the world's highest uninterrupted waterfall, is here."]},
  {name:"Vietnam", clues:["I am a country in Southeast Asia.","My capital is Hanoi.","My coastline stretches along the South China Sea."]},

  {name:"Yemen", clues:["I am a country on the southern Arabian Peninsula.","My capital is Sana'a.","I have a coastline along the Red Sea and Arabian Sea."]},

  {name:"Zambia", clues:["I am a landlocked country in southern Africa.","My capital is Lusaka.","Victoria Falls lies on my border with Zimbabwe."]},
  {name:"Zimbabwe", clues:["I am a landlocked country in southern Africa.","My capital is Harare.","Victoria Falls lies on my border with Zambia."]}

];

let current, tries, locked = false;

function newMystery(){
  current = mysteries[Math.floor(Math.random()*mysteries.length)];
  tries = 0;
  locked = false;
  guess.disabled = false;
  checkBtn.disabled = false;
  progress.textContent = "Guess the country from the clues below:";
  clues.innerHTML = current.clues.map(c => `• ${c}`).join("<br>");
  answer.textContent = "";
  answer.className = "mt-4 fw-bold";
  guess.value = "";
  guess.focus();
}

function check(){
  if (locked) return; // ignore any attempt after the answer is revealed

  let g = guess.value.trim().toLowerCase();
  tries++;

  if (g === current.name.toLowerCase()) {
    answer.textContent = "🎉 Correct! The answer was " + current.name + ".";
    answer.className = "mt-4 fw-bold correct";
    lockInput();
  } else if (tries >= 3) {
    answer.textContent = `Not quite — the answer was ${current.name}. Try a new mystery!`;
    answer.className = "mt-4 fw-bold incorrect";
    lockInput();
  } else {
    answer.textContent = "Not quite. Try again!";
    answer.className = "mt-4 fw-bold incorrect";
  }
}

function lockInput(){
  locked = true;
  guess.disabled = true;
  checkBtn.disabled = true;
}

newMystery(); // start the first round automatically
</script></body></html>
