function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
const q=shuffle(bank).slice(0,8);
let i=0,score=0,answered=false;

const quiz=document.getElementById("quiz");
const next=document.getElementById("next");
const scoreBox=document.getElementById("score");

// --- Audio Reader (text-to-speech) ---
const ttsToggle=document.getElementById("ttsToggle");
const ttsLabel=document.getElementById("ttsLabel");
const synth="speechSynthesis" in window ? window.speechSynthesis : null;

if(!synth){
  ttsToggle.checked=false;
  ttsToggle.disabled=true;
  ttsLabel.textContent="🔇 Audio Reader: not supported";
}
const ttsOn=()=>!!synth && ttsToggle.checked;

function syncTts(){
  document.body.classList.toggle("tts-enabled",ttsOn());
  if(synth && !ttsToggle.disabled){
    ttsLabel.textContent=ttsOn()?"🔊 Audio Reader: ON":"🔇 Audio Reader: OFF";
  }
  if(synth && !ttsOn()) synth.cancel();
}
ttsToggle.addEventListener("change",syncTts);
syncTts();

function speak(text){
  if(!ttsOn()||!text) return;
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  synth.speak(u);
}

// Delegated listeners on the card survive re-rendering between questions
const card=document.querySelector(".quiz-card");
card.addEventListener("mouseover",e=>{
  const el=e.target.closest("[data-speak]");
  if(el && !el.contains(e.relatedTarget)) speak(el.dataset.speak);
});
card.addEventListener("focusin",e=>{
  const el=e.target.closest("[data-speak]");
  if(el) speak(el.dataset.speak);
});
window.addEventListener("beforeunload",()=>synth&&synth.cancel());

// --- Quiz ---
function show(){
  answered=false;
  const x=q[i];
  quiz.innerHTML=`<p class="text-secondary">Question ${i+1} of ${q.length} · ${x[0]}</p>
    <h2 data-speak="${x[1]}">${x[1]}</h2>
    ${x[2].map((o,n)=>`<button class="answer btn btn-outline-dark d-block w-100 text-start my-2" data-n="${n}" data-speak="${o}">${o}</button>`).join("")}`;
  speak(`Question ${i+1} of ${q.length}. ${x[1]}`);
  document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>{
    if(answered)return;
    answered=true;
    if(+b.dataset.n===x[3]){
      score++;
      b.classList.add("border-success");
      scoreEl();
      speak("Correct!");
    } else {
      b.classList.add("border-danger");
      document.querySelectorAll(".answer")[x[3]].classList.add("border-success");
      scoreEl();
      speak(`Incorrect. The correct answer is ${x[2][x[3]]}.`);
    }
  });
}

function scoreEl(){
  const t=`Score: ${score}/${q.length}`;
  scoreBox.textContent=t;
  scoreBox.dataset.speak=`Your score is ${score} out of ${q.length}.`;
}

next.onclick=()=>{
  i++;
  if(i<q.length) show();
  else {
    const msg=`Quiz complete! You scored ${score} out of ${q.length}.`;
    quiz.innerHTML=`<div data-speak="${msg}"><h1>🎉 Quiz Complete!</h1><p class="lead">You scored <b>${score}/${q.length}</b>.</p></div><button class="btn btn-dark" data-speak="Try again" onclick="location.reload()">Try Again</button>`;
    next.style.display="none";
    scoreEl();
    speak(msg);
  }
};

show();
</script>
